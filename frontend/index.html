<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Reelish</title>
    <meta name="description" content="Share any TikTok, Reel or Short and its ingredients land on your grocery list, merged and sorted by aisle." />
    <!-- Link previews (LinkedIn, iMessage, X...). The server fills in __PUBLIC_URL__. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reelish" />
    <meta property="og:title" content="Reelish: share a recipe video, get the grocery list" />

    <meta property="og:url" content="__PUBLIC_URL__/" />
    <meta property="og:image" content="__PUBLIC_URL__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Reelish: share a recipe video, get the grocery list" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#12101A" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reelish" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
